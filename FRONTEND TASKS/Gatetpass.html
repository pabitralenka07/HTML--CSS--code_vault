<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Campus Security Out-Pass & Gate Pass Request System</title>
<style>
    body {
        font-family: "Times New Roman", serif;
        margin: 40px;
        color: #000;
    }

    .container {
        width: 900px;
        margin: auto;
    }

    h2 {
        text-align: center;
        text-transform: uppercase;
        font-weight: bold;
        border-bottom: 2px solid black;
        display: inline-block;
        width: 100%;
        padding-bottom: 5px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 15px 0;
    }

    .col {
        width: 30%;
    }

    label {
        font-weight: bold;
    }

    .line {
        border-bottom: 1px solid black;
        display: inline-block;
        width: 100%;
        height: 20px;
    }

    .full-line {
        border-bottom: 1px solid black;
        display: inline-block;
        width: 100%;
        height: 20px;
    }

    .bottom {
        margin-top: 60px;
        display: flex;
        justify-content: space-between;
    }

    .signature {
        text-align: right;
    }

    .sign-line {
        border-bottom: 1px solid black;
        width: 250px;
        height: 30px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="container">

    <h2>NALANDA INSTITUTE OF TECHNOLOGY (STUDENT'S OUT PASS FORM)</h2>

    <div class="row">
        <div class="col">
            <label>Name:</label>
        </div>
        <div class="col">
            <label>Regd. No.</label>
        </div>
        <div class="col">
            <label>Branch:</label>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Time From:</label>
        </div>
        <div class="col">
            <label>Time Up to:</label>
        </div>
        <div class="col">
            <label>Date:</label>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Proceeding To:</label>
        </div>
        <div class="col">
            <label>Reason:</label>
        </div>
        <div class="col">
            <label>Room No:</label>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Mobile No:</label>
        </div>
        <div class="col">
            <label>Hostel No:</label>
        </div>
        <div class="col">
            <label>Father’s Mob. No:</label>
        </div>
    </div>

    <div class="bottom">
        <div>
            <strong>Administrative Officer / Hostel Superintendent</strong>
        </div>

        <div class="signature">
            <div class="sign-line"></div>
            <strong>Signature of the Student</strong>
        </div>
    </div>

    <div class="footer" style="text-align: center; margin-top: 30px;font-size: 14px">
    Created by @Pabitra Lenka
</div>

</div>

</body>
</html>
