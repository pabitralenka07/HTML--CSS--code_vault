<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
    <style>
            table {
                border-collapse: collapse;
                font-family: Arial, sans-serif;
        }
        th,td{
            text-align: center;
        }
    </style>
</head>
<body>
    <table border="1" width="100%" height="400px" background=".jpg" >
        <tr>
            <th>Time/Day</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>
        <tr>
            <td>9:00 - 10:00</td>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
            <td>E</td>
        </tr>
        <tr>
            <td>10:00 - 11:00</td>
            <td>F</td>
            <td>G</td>
            <td>H</td>
            <td>I</td>
            <td>J</td>
        </tr>
        <tr>
            <td>11:00 - 12:00</td>
            <td>K</td>
            <td>L</td>
            <td>M</td>
            <td>N</td>
            <td>O</td>
        </tr>
        <tr>
            <td>12:00 - 1:00</td>
            <td>P</td>
            <td>Q</td>
            <td>R</td>
            <td>S</td>
            <td>T</td>
        </tr>
        <tr>
            <td>2:00 - 3:00</td>
            <td>U</td>
            <td>V</td>
            <td>w</td>
            <td>X</td>
            <td>Y</td>
        </tr>
    </table>
</body>
</html>
