<!DOCTYPE html>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
    </style>

<body>
    <h1>Computer System</h1>
    <ol>
        <li>Hardware
            <ol type="i">
                <li>CPU</li>
                <li>RAM</li>
                <li>I/O Devices</li>
            </ol>
        </li>

            <ol type="A">
                <li>System Software
                    <ol type="a">
                        <li>Operating System</li>

                    </ol>

                    <ol type="a">
                        <li>Word Processors</li>

                    </ol>
                </li>
            </ol>
        </li>
    </ol>
