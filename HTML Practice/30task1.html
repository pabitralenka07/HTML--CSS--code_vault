<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Personal Information 2.0</title>
</head>

<body style= "display:flex; align-items: center; justify-content: center;">
    <fieldset style="width:350px; height:540px; border-width:6px ; border:1px solid rgb(57, 42, 42) ;margin-bottom:10px; ">
        <legend>User Personal Information </legend>
    <form>
        
        <h1>Registration Form</h1> 
        <b>Enter your full name : </b> <br>
        <input type="text" style="width: 95%;" placeholder="Full Name">
        <br>
        <br>
        
        <b>Enter your Email :</b> <br>
        <input type="email" style="width: 95%;" placeholder="Gmail">
        <br>
        <br>
        <b>Enter your password :</b> <br>
        <input type="password" style="width: 95%;" placeholder="Enter pass">
        <br>
        <br>
        <b>Confirm your password :</b> <br>
        <input type="password" style="width: 95%;" placeholder="Re-enter pass">
        <br>
        <br>
        <b>Enter your gender :</b> <br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Others
        <br>
        <br>
        <b>Enter your date of birth :</b> <br>
        <input type="date" style="width: 95%;" placeholder="">
        <br>
        <br>
        <b>Enter your address :</b> <br>
        <input type="address"  style="width: 95%;" placeholder="Address">
        <br>
        <br>
        <center><input type="submit" style="width: 50%;height: 30px;; border-color:rgb(88, 189, 232); background-color:rgb(60, 176, 239); color:aliceblue"></center>

    </form>
</fieldset>

</body>
</html>
