<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h3, initial-scale=1.0">
    <title>DOCUMENTATION</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(246, 14, 14, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #357ae8;
        }
    </style>
            
</head>
<body>
    <h2>Google Registration Form</h2>
    <main>
        <pre>
<input type="text" placeholder="Enter name" ><br><br>
<input type="text" placeholder="Enter password"> <br><br>
<input type="text" placeholder="Enter email"><br><br>
<input type="text" placeholder="Enter phone number"><br><br>
Highest qualification
<br>
<input type="radio" value="12th" name="class" id="101">12th
<input type="radio" value="B.tech" name="class">B.tech
<br><br>Select Subject
<label for="101">
<input type="checkbox" value="Math" name="subject" id="101">Math
</label>
<label for="102">
<input type="checkbox" value="Chemistry" name="subject" id="102">Chemistry
</label>
<label for="103">
<input type="checkbox" value="Physics" name="subject" id="103">Physics
</label>
<label for="104">
<input type="checkbox" value="UHV" name="subject" id="104">UHV
</label><br>
SELECT YOUR CITY:
<select name="city" id="">
<option value="Bhubaneswar">bhubaneswar</option>
<option value="Delhi">Delhi</option>
<option value="Mumbai">Mumbai</option>
<option value="Banglore">Banglore</option>
</select><BR><BR>
<textarea name="feedback" id="101" placeholder="Give your feedback"></textarea> </pre><pre>
<input type="Submit" value="submit">
</pre>
</main>
</body>
</html>
