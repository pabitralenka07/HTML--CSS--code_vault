<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Menu & `<optgroup>` Form Controls</title>
    <style>
        fieldset{
            background-color: rgb(197, 225, 250);
        }
        .t{
            background-color: #c57777
        }
    </style>
</head>
<body>
    <fieldset style="height: 500px; width: 300px ">
        <legend>My page</legend>
    <h2><label for="branch">Choose a branch:</label></h2>
    <select name="" id="">
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="ELECTRICAL">ELECTRICAL</option>
    </select>
    <br>
    <br>
    <textarea name="message" rows="10" cols="30">
        The cat was playing in the garden.
    </textarea>
    <br>
    <br>
    file: <input type="file" accept="babu.pdf">
    <br>
    <br>
    <button type="button" onclick="alert('Hello World!')">Click Me !</button>
    <br>
    <br>
    <label for="pin">Pin :</label><br>
    <input type="tel" name="pin" maxlength="7"> <br><br>
    <input type="submit" value="submit">
    <input type="button" value="reset">
    <input type="button" value="cancel">
</fieldset>

        <h1 class="t">pabitra</h1>
        <h2 class="t">sandeep</h2>
        <h3 class="t">kiran</h3>
        <h4 class="t">chinmaya</h4>
        <h5 class="t">suraj bhai</h5>

        <h3>Select your sub :</h3>
    <select name="" id="">
        
        <option value="selected">select</option>
        <optgroup label="ist dem">
            <option value="java">java</option>
            <option value="dsa">dsa</option>
            <option value="python">python</option>
        </optgroup>
        <optgroup label="2st dem">
            <option value="c">java</option>
            <option value="bme">dsa</option>
            <option value="pc">python</option>
        </optgroup>
    </select>
</body>     
</body>
</html>
